name: 自动更新GitHub镜像测速表

on:
  # 定时执行：UTC 2:00 / 14:00 = 北京时间 10:00 / 22:00，与官方接口同步
  schedule:
    - cron: '0 2,14 * * *'
  # 支持手动触发
  workflow_dispatch:

# 授予工作流仓库写入、Issue修改权限
permissions:
  contents: write
  issues: write

jobs:
  update-mirrors:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 拉取接口数据并生成Markdown表格
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const API_URL = 'https://hiwiki.org/data/mirror-speeds.json';

            // 请求测速数据
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error(`接口请求失败: ${res.status}`);
            const data = await res.json();

            // 格式化北京时间
            const updateTime = new Date(data.updatedAt).toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit'
            });

            // 数据排序：正常镜像按速度降序在前，超时镜像在后
            const okList = data.mirrors
              .filter(item => item.status === 'ok')
              .sort((a, b) => b.speed - a.speed);
            const errorList = data.mirrors.filter(item => item.status !== 'ok');
            const fullList = [...okList, ...errorList];

            // 生成表格行
            const tableRows = fullList.map((item, index) => {
              const latency = item.latency ?? '—';
              const speed = item.speed ?? '—';
              const status = item.status === 'ok' ? '正常' : '超时';
              return `| ${index + 1} | ${item.label} | ${latency} | ${speed} | ${status} |`;
            }).join('\n');

            // 拼接完整 Markdown 内容
            const markdown = `
### GitHub 镜像源测速表
> 数据自动同步自 hiwiki 镜像接口，每12小时自动更新，最后更新时间：${updateTime}

| 序号 | 镜像地址 | 延迟（ms） | 下载速度（MB/s） | 状态 |
| :---: | --- | :---: | :---: | :---: |
${tableRows}
`.trim();

            // 写入仓库文件
            fs.writeFileSync('mirrors.md', markdown + '\n');
            console.log('✅ 镜像表已生成到 mirrors.md');

      - name: 提交并推送文件到仓库
        id: commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add mirrors.md
          
          if git diff --cached --quiet; then
            echo "无数据更新，跳过提交"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "自动更新镜像测速表"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 已提交变更到仓库"
          fi

      - name: 同步更新指定Issue正文
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('mirrors.md', 'utf8');
            
            // ========== 请修改为你的 Issue 编号 ==========
            const ISSUE_NUMBER = 14;
            // ===========================================
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ISSUE_NUMBER,
              body: content
            });
            console.log(`✅ Issue #${ISSUE_NUMBER} 正文已同步更新`);
