name: 自动更新GitHub镜像测速表

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-mirrors:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 拉取接口数据并生成 Markdown
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const API_URL = 'https://hiwiki.org/data/mirror-speeds.json';

            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('接口请求失败: ' + res.status);
            const data = await res.json();

            const updateTime = new Date(data.updatedAt).toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });

            const statusMap = {
              ok: '正常',
              error: '超时',
              '404': '不支持'
            };

            const okList = data.mirrors
              .filter(item => item.status === 'ok')
              .sort((a, b) => b.speed - a.speed);
            const errorList = data.mirrors.filter(item => item.status !== 'ok');
            const fullList = [...okList, ...errorList];

            const tableRows = fullList.map((item, index) => {
              const latency = item.latency != null ? item.latency : '—';
              const speed = item.speed != null ? item.speed.toFixed(2) : '—';
              const status = statusMap[item.status] || item.status;
              return '| ' + (index + 1) + ' | ' + item.label + ' | ' + latency + ' | ' + speed + ' | ' + status + ' |';
            }).join('\n');

            const markdown = '### GitHub 镜像源测速表\n> 数据自动同步自 hiwiki 镜像接口，每12小时自动更新，最后更新时间：' + updateTime + '\n\n| 序号 | 镜像地址 | 延迟（ms） | 下载速度（MB/s） | 状态 |\n| :---: | --- | :---: | :---: | :---: |\n' + tableRows + '\n';

            fs.writeFileSync('mirrors.md', markdown);
            console.log('镜像表已生成到 mirrors.md');

            let changed = true;
            try {
              execSync('git diff --quiet mirrors.md');
              changed = false;
              console.log('数据无变化，跳过后续提交');
            } catch (e) {
              changed = true;
            }
            core.setOutput('changed', String(changed));

      - name: 提交并推送到仓库
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add mirrors.md
          git commit -m "自动更新镜像测速表"
          git push

      - name: 同步更新指定 Issue 正文
        if: steps.generate.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('mirrors.md', 'utf8');
            const ISSUE_NUMBER = 14;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ISSUE_NUMBER,
              body: content
            });
            console.log('Issue #' + ISSUE_NUMBER + ' 正文已同步更新');
