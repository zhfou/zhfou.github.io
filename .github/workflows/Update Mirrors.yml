name: 自动更新镜像JSON + 更新Issue#14
on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 处理数据、生成json、更新Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const API_URL = 'https://hiwiki.org/data/mirror-speeds.json';
            const OUTPUT_FILE = './mirror-github.json';
            const ISSUE_NUMBER = 14;

            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('接口请求失败: ' + res.status);
            const rawData = await res.json();

            const updateTime = new Date(rawData.updatedAt).toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });

            const statusMap = {
              ok: '正常',
              error: '超时',
              '404': '不支持'
            };

            const okList = rawData.mirrors
              .filter(item => item.status === 'ok')
              .sort((a, b) => b.speed - a.speed);
            const errorList = rawData.mirrors.filter(item => item.status !== 'ok');
            const fullList = [...okList, ...errorList];

            const jsonOutput = {
              updatedAt: rawData.updatedAt,
              updateTimeCN: updateTime,
              mirrors: fullList.map(item => ({
                label: item.label,
                latency: item.latency ?? null,
                speed: item.speed ?? null,
                status: item.status,
                statusText: statusMap[item.status] || item.status
              }))
            };
            fs.writeFileSync(OUTPUT_FILE, JSON.stringify(jsonOutput, null, 2), 'utf8');

            const tableRows = fullList.map((item, index) => {
              const latency = item.latency != null ? `${item.latency} ms` : '—';
              const speed = item.speed != null ? `${item.speed.toFixed(2)} MB/s` : '—';
              const status = statusMap[item.status] || item.status;
              return `| ${index + 1} | ${item.label} | ${latency} | ${speed} | ${status} |`;
            });

            const totalCount = rawData.mirrors.length;
            const okCount = rawData.mirrors.filter(x=>x.status==='ok').length;
            const errorCount = rawData.mirrors.filter(x=>x.status==='error').length;
            const notSupportCount = rawData.mirrors.filter(x=>x.status==='404').length;

            const mdArr = [
              '### 最新可用地址',
              '镜像源每 12 小时测速，自动最优不行就手动换正常节点。',
              '本页面自动轮询检测各大 GitHub 加速代理，实时展示连通状态、延迟与测速结果。测速存在网络波动，仅供参考，请优先选择状态为正常的镜像使用。',
              '',
              `${totalCount} 个镜像 ● <span style="color:#2da44e;">🟢 ${okCount} 正常</span> ● <span style="color:#cf222e;">🔴 ${errorCount} 超时</span> ● <span style="color:#828282;">⚫ ${notSupportCount} 不支持</span>`,
              '',
              '#### 使用说明',
              '- 点击【复制】拿到镜像前缀，在原 GitHub 链接前面拼接该地址即可加速下载',
              '- 仅正常状态镜像可复制；超时、不支持状态无法使用，按钮已锁定',
              '- 不支持：该代理格式不兼容，无法用于 GitHub 加速；超时：当前网络无法连通',
              '- 所有镜像均为第三方公共服务，不保证长期稳定，建议多备用几个镜像',
              '',
              '| ID | 镜像 | 延迟 | 速度 | 状态 |',
              '|:---:|:---:|:---:|:---:|:---:|',
              ...tableRows
            ];
            const newIssueBody = mdArr.join('\n');

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ISSUE_NUMBER
            });

            if (issue.body.trim() !== newIssueBody.trim()) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ISSUE_NUMBER,
                body: newIssueBody
              });
              console.log('✅ Issue #14 已更新');
            } else {
              console.log('ℹ️ Issue内容无变化，跳过更新Issue');
            }
