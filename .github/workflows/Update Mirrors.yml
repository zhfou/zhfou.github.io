name: 自动更新GitHub镜像测速表

on:
  schedule:
    # UTC 2:00 / 14:00 = 北京时间 10:00 / 22:00
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-mirrors:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 拉取接口数据并生成 Markdown
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const core = require('@actions/core');
            const API_URL = 'https://hiwiki.org/data/mirror-speeds.json';

            // 1. 请求接口数据
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error(`接口请求失败: ${res.status}`);
            const data = await res.json();

            // 2. 格式化北京时间
            const updateTime = new Date(data.updatedAt).toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });

            // 3. 状态映射
            const statusMap = {
              ok: '正常',
              error: '超时',
              '404': '不支持'
            };

            // 4. 数据排序：正常在前（速度降序），异常在后
            const okList = data.mirrors
              .filter(item => item.status === 'ok')
              .sort((a, b) => b.speed - a.speed);
            const errorList = data.mirrors.filter(item => item.status !== 'ok');
            const fullList = [...okList, ...errorList];

            // 5. 生成表格行
            const tableRows = fullList.map((item, index) => {
              const latency = item.latency != null ? item.latency : '—';
              const speed = item.speed != null ? item.speed.toFixed(2) : '—';
              const status = statusMap[item.status] || item.status;
              return `| ${index + 1} | ${item.label} | ${latency} | ${speed} | ${status} |`;
            }).join('\n');

            // 6. 拼接完整 Markdown（顶格写，避免多余缩进）
            const markdown = `### GitHub 镜像源测速表
> 数据自动同步自 hiwiki 镜像接口，每12小时自动更新，最后更新时间：${updateTime}

| 序号 | 镜像地址 | 延迟（ms） | 下载速度（MB/s） | 状态 |
| :---: | --- | :---: | :---: | :---: |
${tableRows}
`;

            // 7. 写入文件
            fs.writeFileSync('mirrors.md', markdown);
            console.log('✅ 镜像表已生成到 mirrors.md');

            // 8. 判断文件是否有变更
            let changed = true;
            try {
              execSync('git diff --quiet mirrors.md');
              changed = false;
              console.log('ℹ️  数据无变化，跳过后续提交');
            } catch (e) {
              changed = true;
            }
            // 正确设置输出变量
            core.setOutput('changed', String(changed));

      - name: 提交并推送到仓库
        if: steps.generate.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add mirrors.md
          git commit -m "自动更新镜像测速表"
          git push

      - name: 同步更新指定 Issue 正文
        if: steps.generate.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('mirrors.md', 'utf8');

            // 修改为你的 Issue 编号
            const ISSUE_NUMBER = 14;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ISSUE_NUMBER,
              body: content
            });
            console.log(`✅ Issue #${ISSUE_NUMBER} 正文已同步更新`);
