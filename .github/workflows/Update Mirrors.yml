name: 自动更新镜像表到Issue

on:
  schedule:
    # UTC 2:00 / 14:00 = 北京时间 10:00 / 22:00
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  update-issue-mirrors:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取数据并更新Issue正文
        uses: actions/github-script@v7
        with:
          script: |
            const API_URL = 'https://hiwiki.org/data/mirror-speeds.json';
            // 修改为你的目标 Issue 编号
            const ISSUE_NUMBER = 14;

            // 1. 拉取接口数据
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('接口请求失败: ' + res.status);
            const data = await res.json();

            // 2. 格式化北京时间
            const updateTime = new Date(data.updatedAt).toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });

            // 3. 状态映射
            const statusMap = {
              ok: '正常',
              error: '超时',
              '404': '不支持'
            };

            // 4. 数据排序：正常在前（速度降序），异常在后
            const okList = data.mirrors
              .filter(item => item.status === 'ok')
              .sort((a, b) => b.speed - a.speed);
            const errorList = data.mirrors.filter(item => item.status !== 'ok');
            const fullList = [...okList, ...errorList];

            // 5. 生成表格行
            const tableRows = fullList.map((item, index) => {
              const latency = item.latency != null ? item.latency : '—';
              const speed = item.speed != null ? item.speed.toFixed(2) : '—';
              const status = statusMap[item.status] || item.status;
              return '| ' + (index + 1) + ' | ' + item.label + ' | ' + latency + ' | ' + speed + ' | ' + status + ' |';
            }).join('\n');

            // 6. 拼接完整 Markdown 内容
            const newContent = '### GitHub 镜像源测速表\n> 数据自动同步自 hiwiki 镜像接口，每12小时自动更新，最后更新时间：' + updateTime + '\n\n| 序号 | 镜像地址 | 延迟（ms） | 下载速度（MB/s） | 状态 |\n| :---: | --- | :---: | :---: | :---: |\n' + tableRows + '\n';

            // 7. 获取当前Issue正文，对比是否有变化
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ISSUE_NUMBER
            });

            if (issue.body.trim() === newContent.trim()) {
              console.log('数据无变化，跳过Issue更新');
              return;
            }

            // 8. 更新Issue正文
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ISSUE_NUMBER,
              body: newContent
            });
            console.log('Issue #' + ISSUE_NUMBER + ' 正文已更新完成');
