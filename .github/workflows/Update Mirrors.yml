name: 自动生成 mirror-github.json
on:
  schedule:
    # UTC 2:00 / 14:00 = 北京时间 10:00 / 22:00
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-json:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 拉取测速接口，生成 mirror-github.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const API_URL = 'https://hiwiki.org/data/mirror-speeds.json';
            const OUTPUT_FILE = './mirror-github.json';

            // 拉取源数据
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('接口请求失败: ' + res.status);
            const rawData = await res.json();

            // 北京时间格式化
            const updateTime = new Date(rawData.updatedAt).toLocaleString('zh-CN', {
              timeZone: 'Asia/Shanghai',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });

            // 状态映射
            const statusMap = {
              ok: '正常',
              error: '超时',
              '404': '不支持'
            };

            // 排序：正常在前、速度降序，异常放后面
            const okList = rawData.mirrors
              .filter(item => item.status === 'ok')
              .sort((a, b) => b.speed - a.speed);
            const errorList = rawData.mirrors.filter(item => item.status !== 'ok');
            const fullList = [...okList, ...errorList];

            // 组装输出JSON结构，前端组件直接读这个
            const output = {
              updatedAt: rawData.updatedAt,
              updateTimeCN: updateTime,
              mirrors: fullList.map(item => {
                return {
                  label: item.label,
                  latency: item.latency ?? null,
                  speed: item.speed ?? null,
                  status: item.status,
                  statusText: statusMap[item.status] || item.status
                };
              })
            };

            // 写入文件
            fs.writeFileSync(OUTPUT_FILE, JSON.stringify(output, null, 2), 'utf8');
            console.log('文件已生成：', OUTPUT_FILE);

      - name: 提交并推送（仅内容变化时）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mirror-github.json
          # 没有变更直接退出
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "auto update mirror-github.json"
          git push origin main
